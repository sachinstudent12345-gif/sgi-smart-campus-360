<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Lab | SGI Smart Campus 360</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .lab-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #8290a5;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 25px;
            padding: 10px 18px;
            border: 1px solid rgba(0, 212, 255, 0.25);
            border-radius: 10px;
            color: #00d4ff;
            text-decoration: none;
            background: rgba(0, 212, 255, 0.06);
            transition: 0.3s;
        }

        .back-btn:hover {
            background: rgba(0, 212, 255, 0.12);
            transform: translateX(-3px);
        }

        .lab-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .lab-card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(148, 163, 184, 0.12);
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.18);
        }

        .lab-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 21px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(2, 6, 23, 0.65);
            color: #ffffff;
            outline: none;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.08);
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #00d4ff, #2563eb);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.2);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message-box {
            display: none;
            margin-bottom: 18px;
            padding: 13px 15px;
            border-radius: 10px;
            font-size: 14px;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.25);
            color: #4ade80;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
        }

        .report-item {
            padding: 18px;
            margin-bottom: 14px;
            border-radius: 13px;
            background: rgba(2, 6, 23, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .report-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .report-lab {
            font-weight: 600;
            color: #ffffff;
        }

        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.12);
            color: #fbbf24;
        }

        .status-progress {
            background: rgba(59, 130, 246, 0.12);
            color: #60a5fa;
        }

        .status-resolved {
            background: rgba(34, 197, 94, 0.12);
            color: #4ade80;
        }

        .report-issue {
            color: #aab4c3;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .report-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .meta-tag {
            padding: 5px 9px;
            border-radius: 7px;
            background: rgba(148, 163, 184, 0.08);
            color: #94a3b8;
            font-size: 11px;
        }

        .empty-state,
        .loading {
            text-align: center;
            padding: 45px 15px;
            color: #718096;
        }

        @media (max-width: 800px) {
            .lab-grid {
                grid-template-columns: 1fr;
            }

            .page-header h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="nav-left">
            <strong>SGI</strong>
            <span>Smart Campus 360</span>
        </div>

        <div class="profile-info">

            <strong id="studentName">
                Student
            </strong>

            <span>
                Campus ID:
                <span id="studentCampusId">
                    ---
                </span>
            </span>

        </div>

    </nav>


    <!-- MAIN -->

    <main class="lab-page">

        <a href="dashboard.html" class="back-btn">
            ← Back to Dashboard
        </a>


        <div class="page-header">

            <h1>
                Smart Lab 🧪
            </h1>

            <p>
                Report laboratory and computer-related issues and track their status.
            </p>

        </div>


        <div class="lab-grid">


            <!-- REPORT LAB ISSUE -->

            <section class="lab-card">

                <h2>
                    Report Lab Issue
                </h2>


                <div
                    id="successMessage"
                    class="message-box success-message">
                </div>


                <div
                    id="errorMessage"
                    class="message-box error-message">
                </div>


                <form id="labForm">


                    <!-- LAB NAME -->

                    <div class="form-group">

                        <label for="labName">
                            Laboratory Name
                        </label>

                        <select
                            id="labName"
                            required>

                            <option value="">
                                Select laboratory
                            </option>

                            <option value="CSE Lab 1">
                                CSE Lab 1
                            </option>

                            <option value="CSE Lab 2">
                                CSE Lab 2
                            </option>

                            <option value="CSE Lab 3">
                                CSE Lab 3
                            </option>

                            <option value="IT Lab">
                                IT Lab
                            </option>

                            <option value="AI Lab">
                                AI Lab
                            </option>

                            <option value="Electronics Lab">
                                Electronics Lab
                            </option>

                            <option value="Mechanical Lab">
                                Mechanical Lab
                            </option>

                            <option value="Civil Lab">
                                Civil Lab
                            </option>

                        </select>

                    </div>


                    <!-- COMPUTER ID -->

                    <div class="form-group">

                        <label for="computerId">
                            Computer / Equipment ID
                        </label>

                        <input
                            type="text"
                            id="computerId"
                            placeholder="Example: PC-24"
                            required>

                    </div>


                    <!-- ISSUE -->

                    <div class="form-group">

                        <label for="issue">
                            Issue Description
                        </label>

                        <textarea
                            id="issue"
                            placeholder="Describe the laboratory issue..."
                            required></textarea>

                    </div>


                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        class="submit-btn"
                        id="submitBtn">

                        Report Lab Issue 🚀

                    </button>

                </form>

            </section>


            <!-- HISTORY -->

            <section class="lab-card">

                <h2>
                    My Lab Reports
                </h2>


                <div id="reportsList">

                    <div class="loading">
                        Loading lab reports...
                    </div>

                </div>

            </section>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script>

        // ==========================================
        // CHECK LOGIN
        // ==========================================

        const studentData =
            localStorage.getItem("student");


        if (!studentData) {

            window.location.href = "/";

        }


        const student =
            JSON.parse(studentData);


        console.log(
            "Logged in student:",
            student
        );


        // ==========================================
        // STUDENT INFORMATION
        // ==========================================

        document.getElementById(
            "studentName"
        ).textContent =
            student.name;


        document.getElementById(
            "studentCampusId"
        ).textContent =
            student.campus_id;


        // ==========================================
        // ELEMENTS
        // ==========================================

        const form =
            document.getElementById(
                "labForm"
            );


        const submitBtn =
            document.getElementById(
                "submitBtn"
            );


        const reportsList =
            document.getElementById(
                "reportsList"
            );


        const successMessage =
            document.getElementById(
                "successMessage"
            );


        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        // ==========================================
        // MESSAGE FUNCTIONS
        // ==========================================

        function showSuccess(message) {

            successMessage.textContent =
                message;

            successMessage.style.display =
                "block";

            errorMessage.style.display =
                "none";

        }


        function showError(message) {

            errorMessage.textContent =
                message;

            errorMessage.style.display =
                "block";

            successMessage.style.display =
                "none";

        }


        // ==========================================
        // LOAD LAB REPORTS
        // ==========================================

        function loadReports() {

            reportsList.innerHTML =
                '<div class="loading">Loading lab reports...</div>';


           fetch(
    `https://sgi-smart-campus-360-api.onrender.com/api/lab-reports/${student.campus_id}`
)

            .then(response =>
                response.json()
            )

            .then(data => {

                if (
                    !data.success ||
                    !data.reports
                ) {

                    reportsList.innerHTML =
                        '<div class="empty-state">Unable to load lab reports.</div>';

                    return;

                }


                if (
                    data.reports.length === 0
                ) {

                    reportsList.innerHTML = `

                        <div class="empty-state">

                            <div style="font-size:38px;">
                                🧪
                            </div>

                            <p>
                                No lab reports submitted yet.
                            </p>

                            <small>
                                Your reported lab issues will appear here.
                            </small>

                        </div>

                    `;

                    return;

                }


                reportsList.innerHTML = "";


                data.reports.forEach(
                    report => {

                        let statusClass =
                            "status-pending";


                        if (
                            report.status ===
                            "In Progress"
                        ) {

                            statusClass =
                                "status-progress";

                        }


                        if (
                            report.status ===
                            "Resolved"
                        ) {

                            statusClass =
                                "status-resolved";

                        }


                        const item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "report-item";


                        item.innerHTML = `

                            <div class="report-top">

                                <span class="report-lab">
                                    🧪 ${escapeHtml(report.lab_name)}
                                </span>

                                <span class="status ${statusClass}">
                                    ${escapeHtml(report.status)}
                                </span>

                            </div>


                            <div class="report-issue">

                                ${escapeHtml(report.issue)}

                            </div>


                            <div class="report-meta">

                                <span class="meta-tag">
                                    💻 ${escapeHtml(report.computer_id)}
                                </span>

                                <span class="meta-tag">
                                    #${report.id}
                                </span>

                            </div>

                        `;


                        reportsList.appendChild(
                            item
                        );

                    }
                );

            })

            .catch(error => {

                console.error(
                    "Lab report loading error:",
                    error
                );

                reportsList.innerHTML = `

                    <div class="empty-state">

                        <div style="font-size:38px;">
                            ⚠️
                        </div>

                        Unable to connect to server.

                    </div>

                `;

            });

        }


        // ==========================================
        // SUBMIT LAB REPORT
        // ==========================================

        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                successMessage.style.display =
                    "none";

                errorMessage.style.display =
                    "none";


                const labName =
                    document.getElementById(
                        "labName"
                    ).value;


                const computerId =
                    document.getElementById(
                        "computerId"
                    ).value.trim();


                const issue =
                    document.getElementById(
                        "issue"
                    ).value.trim();


                if (
                    !labName ||
                    !computerId ||
                    !issue
                ) {

                    showError(
                        "Please fill all required fields."
                    );

                    return;

                }


                submitBtn.disabled =
                    true;

                submitBtn.textContent =
                    "Submitting...";


                const reportData = {

                    campus_id:
                        student.campus_id,

                    lab_name:
                        labName,

                    computer_id:
                        computerId,

                    issue:
                        issue

                };

fetch(
    "https://sgi-smart-campus-360-api.onrender.com/api/lab-reports",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                reportData
                            )

                    }
                )

                .then(response =>
                    response.json()
                )

                .then(data => {

                    if (data.success) {

                        showSuccess(
                            `Lab issue reported successfully! Report ID: #${data.report_id}`
                        );


                        form.reset();


                        loadReports();

                    }

                    else {

                        showError(
                            data.message ||
                            "Unable to submit lab report."
                        );

                    }

                })

                .catch(error => {

                    console.error(
                        "Lab report submit error:",
                        error
                    );

                    showError(
                        "Server connection failed. Please try again."
                    );

                })

                .finally(() => {

                    submitBtn.disabled =
                        false;

                    submitBtn.textContent =
                        "Report Lab Issue 🚀";

                });

            }
        );


        // ==========================================
        // HTML SAFETY
        // ==========================================

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        // ==========================================
        // INITIAL LOAD
        // ==========================================

        loadReports();

    </script>

</body>

</html>
